name: iOS Build (unsigned IPA) - 音乐盒 MusicBox

# 云端 macOS 编译，产出未签名 IPA，供手机端签名工具（AltStore / Sideloadly / Feather / Esign 等）导入后自行签名
# 不需要任何证书 Secret

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    env:
      PROJECT_NAME: MusicBox
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcrun swiftc --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile Swift executable (arm64, iphoneos)
        run: |
          set -e
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc \
            -sdk "$SDK" \
            -target arm64-apple-ios14.0 \
            -O \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            -framework UIKit -framework AVFoundation -framework MediaPlayer \
            -framework UniformTypeIdentifiers -framework CoreMedia -framework Foundation \
            main.swift AppDelegate.swift MusicListViewController.swift \
            -o build/MusicBox
          file build/MusicBox

      - name: Assemble .app bundle
        run: |
          set -e
          mkdir -p build/Payload/MusicBox.app
          cp build/MusicBox build/Payload/MusicBox.app/MusicBox
          cp Info.plist build/Payload/MusicBox.app/Info.plist
          # 内置歌曲（与 app 同包，开箱即播）
          if [ -d songs ]; then
            cp -R songs build/Payload/MusicBox.app/songs
          fi
          # 背景图
          if [ -f bg.jpg ]; then
            cp bg.jpg build/Payload/MusicBox.app/bg.jpg
          fi
          # 先用 ad-hoc 签名让包体自洽；用户用自己的证书重签即可覆盖
          codesign -f -s - --deep build/Payload/MusicBox.app
          ls -lh build/Payload/MusicBox.app

      - name: Package unsigned IPA
        run: |
          set -e
          cd build
          zip -qry "${PROJECT_NAME}-unsigned.ipa" Payload
          ls -lh "${PROJECT_NAME}-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/*.ipa
          retention-days: 30
